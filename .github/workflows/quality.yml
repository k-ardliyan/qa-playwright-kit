name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  fast-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize plaintext local.env for CI
        run: |
          if [ ! -f config/environments/local.env ] || grep -q 'encrypted:' config/environments/local.env 2>/dev/null; then
            cp config/environments/local.env.example config/environments/local.env
            echo "[CI] Materialized plaintext config/environments/local.env from template"
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: XSS scan
        run: npm run xss:scan

      - name: Fast lane summary
        if: always()
        run: |
          echo "## Quality Gate — fast lane (run #${GITHUB_RUN_NUMBER})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks: format:check → lint → typecheck → xss:scan" >> "$GITHUB_STEP_SUMMARY"
          echo "Lane ini gagal hanya jika ada check nyata yang merah." >> "$GITHUB_STEP_SUMMARY"

  full-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize plaintext local.env for CI
        run: |
          if [ ! -f config/environments/local.env ] || grep -q 'encrypted:' config/environments/local.env 2>/dev/null; then
            cp config/environments/local.env.example config/environments/local.env
            echo "[CI] Materialized plaintext config/environments/local.env from template"
          fi

      - name: MCP server install + setup check
        run: npm run install:mcp-server && npm run setup:check

      - name: Architecture & ephemeral validators
        run: npm run validate:architecture && npm run validate:ephemeral && npm run validate

      - name: Sync + twin parity + MCP compat
        run: npm run sync:mcp-generated:check && npm run check:twin-parity && npm run mcp:check

      - name: Requirement & test-plan validation
        run: npx tsx tools/validators/validate-requirement.ts requirements/auth/login-none.md && npm run validate:test-plan

      - name: Contract, traceability & MCP profile suites
        run: npm run test:contract && npm run test:traceability && npm run test:mcp-profiles

      - name: Property tests
        run: npm run test:property

      - name: Unit tests
        run: npm run test:unit

      - name: Dashboard browser suite (seeded report dir, local server)
        run: npm run test:dashboard-browser

      - name: File-content & network-assert suites
        run: npm run test:file-content && npm run test:network-assert

      - name: Build MCP server
        run: npm run mcp:build

      - name: Health check
        run: npm run health:check

      - name: Full lane summary
        if: always()
        run: |
          echo "## Quality Gate — full lane (run #${GITHUB_RUN_NUMBER})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rantai penuh: install → setup:check → validators → sync/parity/mcp:check → requirement/test-plan → contract/traceability/profiles → property → unit → dashboard-browser → file-content → network-assert → mcp:build → health:check" >> "$GITHUB_STEP_SUMMARY"
          echo "Job ini gagal **hanya** jika ada check nyata yang merah — tidak ada skip senyap di dalam rantai." >> "$GITHUB_STEP_SUMMARY"
