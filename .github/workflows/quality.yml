name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize plaintext local.env for CI
        run: |
          if [ ! -f config/environments/local.env ] || grep -q 'encrypted:' config/environments/local.env 2>/dev/null; then
            cp config/environments/local.env.example config/environments/local.env
            echo "[CI] Materialized plaintext config/environments/local.env from template"
          fi

      - name: Run quality gate
        run: npm run test:quality

      - name: Quality gate summary
        if: always()
        run: |
          echo "## Quality Gate — run #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rantai penuh: install → setup:check → format/lint/typecheck/mcp:typecheck/xss → validators → sync:mcp-generated:check → contract/traceability/mcp-profiles → property tests → unit tests → file-content → network-assert → mcp:build → health:check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Job ini gagal **hanya** jika ada check nyata yang merah — tidak ada skip senyap di dalam rantai." >> "$GITHUB_STEP_SUMMARY"
