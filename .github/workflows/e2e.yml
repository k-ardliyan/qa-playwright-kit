name: Playwright E2E Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run tests against
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
      shardCount:
        description: Number of shards (1 = single job, no blob merge)
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-base-url: ${{ steps.check.outputs.has-base-url }}
    steps:
      - name: Check if BASE_URL secret is set
        id: check
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        shell: bash
        run: |
          if [ -n "$BASE_URL" ]; then
            echo "has-base-url=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-base-url=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: check-secrets
    if: needs.check-secrets.outputs.has-base-url == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Fixed max 4 slots; unused shards exit early when shardCount is smaller
        shardIndex: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decide whether this shard runs
        id: shard
        shell: bash
        run: |
          TOTAL="${{ github.event.inputs.shardCount || '1' }}"
          INDEX="${{ matrix.shardIndex }}"
          if [ "$INDEX" -gt "$TOTAL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Shard $INDEX skipped (total=$TOTAL)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.shard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.shard.outputs.skip != 'true'
        run: npm ci

      - name: Materialize CI environment file
        if: steps.shard.outputs.skip != 'true'
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL// }" ]; then
            echo "::error::BASE_URL secret is empty. Configure repository secrets before running E2E."
            exit 1
          fi
          case "${BASE_URL}" in
            *your-app.example.com*|*your-app.example.*)
              echo "::error::BASE_URL still looks like a kit placeholder (${BASE_URL}). Set a real URL secret."
              exit 1
              ;;
          esac
          if [ -z "${TEST_USER_PASSWORD// }" ]; then
            echo "::error::TEST_USER_PASSWORD secret is required for auth setup."
            exit 1
          fi
          if [ -z "${TEST_USER_EMAIL// }" ] && [ -z "${TEST_USER_USERNAME// }" ] && [ -z "${TEST_USER_PHONE// }" ]; then
            echo "::error::Provide at least one of TEST_USER_EMAIL, TEST_USER_USERNAME, or TEST_USER_PHONE."
            exit 1
          fi
          {
            printf 'BASE_URL=%s\n' "${BASE_URL}"
            [ -n "${TEST_USER_EMAIL}" ]    && printf 'TEST_USER_EMAIL=%s\n'    "${TEST_USER_EMAIL}"
            [ -n "${TEST_USER_USERNAME}" ] && printf 'TEST_USER_USERNAME=%s\n' "${TEST_USER_USERNAME}"
            [ -n "${TEST_USER_PASSWORD}" ] && printf 'TEST_USER_PASSWORD=%s\n' "${TEST_USER_PASSWORD}"
            [ -n "${TEST_USER_PHONE}" ]    && printf 'TEST_USER_PHONE=%s\n'    "${TEST_USER_PHONE}"
            printf 'AUTH_SUCCESS_URL_PATH=/dashboard\n'
            printf 'AUTH_LOGIN_URL_PATH=login\n'
            printf 'AUTH_SUCCESS_TEXT=Berhasil Login\n'
            # CI uses plaintext secrets — never encrypt this ephemeral file
            printf 'AUTH_CHALLENGE_MODE=none\n'
          } > "config/environments/${TARGET_ENV}.env"
          # Also write fallback
          mkdir -p environments
          cp "config/environments/${TARGET_ENV}.env" "environments/${TARGET_ENV}.env"
          echo "APP_ENV=${TARGET_ENV}" >> "$GITHUB_ENV"
          echo "Materialized config/environments/${TARGET_ENV}.env (plaintext CI profile)"

      - name: Install MCP server dependencies
        if: steps.shard.outputs.skip != 'true'
        run: npm run install:mcp-server

      - name: Build qa-playwright-kit MCP server
        if: steps.shard.outputs.skip != 'true'
        run: npm run mcp:build

      - name: Install Playwright browsers
        if: steps.shard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.shard.outputs.skip != 'true'
        env:
          CI: 'true'
          # Blob only when sharding (total > 1) for merge-reports
          PW_BLOB: ${{ (github.event.inputs.shardCount || '1') != '1' && '1' || '0' }}
        run: |
          TOTAL="${{ steps.shard.outputs.total }}"
          echo "APP_ENV=${APP_ENV:-unset} · BASE_URL host: $(node -e "try{console.log(new URL(process.env.BASE_URL).host)}catch{console.log('INVALID')}")"
          if [ "$TOTAL" = "1" ]; then
            npm run test:ci
          else
            npx playwright test --project=chromium --shard=${{ matrix.shardIndex }}/$TOTAL --grep-invert @demo
          fi

      - name: Auto-archive if all tests pass
        if: success() && steps.shard.outputs.skip != 'true'
        run: |
          SUMMARY_FILE="artifacts/reports/test-summary.json"
          [ -f "reports/test-summary.json" ] && SUMMARY_FILE="reports/test-summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            # Real numbers from the real reporter — echoed for the log, no silent guessing.
            node -e "const s=require('./$SUMMARY_FILE'); console.log('Summary: total='+s.total, 'passed='+s.passed, 'failed='+s.failed, 'skipped='+s.skipped, 'passRate='+s.passRate+'%')"
            PASS_RATE=$(node -e "const s=require('./$SUMMARY_FILE'); console.log(s.passRate||0)")
            TOTAL=$(node -e "const s=require('./$SUMMARY_FILE'); console.log(s.total||0)")
            if [ "$TOTAL" = "0" ]; then
              echo "::warning::test-summary.json contains total=0 — reporter produced an empty run. NOT auto-archiving."
            elif [ "$PASS_RATE" = "100" ]; then
              echo "All tests passed (100%). Auto-archiving..."
              npm run archive:save -- --decision=APPROVE --notes="CI auto-pass (100%)" --yes || true
            else
              echo "Pass rate: ${PASS_RATE}%. Skipping auto-archive (not 100%)."
            fi
          else
            echo "::warning::No test-summary.json found at $SUMMARY_FILE — custom reporter did not run or wrote elsewhere. Auto-archive skipped."
          fi

      - name: Upload blob report
        if: always() && steps.shard.outputs.skip != 'true' && (github.event.inputs.shardCount || '1') != '1'
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ matrix.shardIndex }}
          path: |
            artifacts/blob-report/
            blob-report/
          retention-days: 7

      - name: Upload Playwright HTML Report
        if: always() && steps.shard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: |
            artifacts/reports/html/
            reports/html/
            playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always() && steps.shard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: |
            artifacts/test-results/
            artifacts/reports/
            test-results/
            reports/
          retention-days: 30

  merge-blob-reports:
    needs: [check-secrets, e2e]
    if: always() && needs.check-secrets.outputs.has-base-url == 'true' && (github.event.inputs.shardCount || '1') != '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-shard-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge blob reports into HTML
        run: |
          if [ -d all-blob-reports ] && [ "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "No blob reports found — skip merge"
          fi

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 30

  e2e-skipped:
    needs: check-secrets
    if: needs.check-secrets.outputs.has-base-url != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip E2E — BASE_URL secret not configured
        run: |
          echo "E2E job skipped: configure BASE_URL and credential secrets in repository settings."
          echo "Required secrets: BASE_URL, TEST_USER_PASSWORD, and at least one of TEST_USER_EMAIL | TEST_USER_USERNAME | TEST_USER_PHONE"
